    <text x="24" y="965" font-size="14" fill="#79c0ff" xml:space="preserve">note: the keyboards listen better anyway</text>
    <text x="24" y="1007" font-size="14" fill="#7ee787" xml:space="preserve">siren@dev:~$ echo &quot;just gonna do a quick refactor&quot;</text>
    <text x="24" y="1028" font-size="14" fill="#d2a8ff" xml:space="preserve">(narrator: it was not quick)</text>
    <text x="24" y="1070" font-size="14" fill="#7ee787" xml:space="preserve">siren@dev:~$ node -e &quot;console.log(status())&quot;</text>
