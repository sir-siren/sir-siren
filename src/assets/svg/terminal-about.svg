    <text x="24" y="503" font-size="14" fill="#8b949e" xml:space="preserve">[INFO] would do it again, zero regrets</text>
    <text x="24" y="545" font-size="14" fill="#7ee787" xml:space="preserve">siren@dev:~$ git log --oneline -5</text>
    <text x="24" y="566" font-size="14" fill="#e6edf3" xml:space="preserve">a1b2c3d fix bug</text>
    <text x="24" y="587" font-size="14" fill="#e6edf3" xml:space="preserve">e4f5g6h please work</text>
    <text x="24" y="608" font-size="14" fill="#e6edf3" xml:space="preserve">h7i8j9k asdkjfhaksjdhf</text>
    <text x="24" y="629" font-size="14" fill="#e6edf3" xml:space="preserve">l0m1n2o actual fix this time i swear</text>
    <text x="24" y="650" font-size="14" fill="#e6edf3" xml:space="preserve">p3q4r5s // TODO: come back to this</text>
