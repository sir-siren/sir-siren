    <text x="24" y="62" font-size="14" fill="#7ee787" xml:space="preserve">siren@dev:~$ whoami</text>
    <text x="24" y="83" font-size="14" fill="#e6edf3" xml:space="preserve">Full-stack developer, professional bug relocator</text>
    <text x="24" y="125" font-size="14" fill="#7ee787" xml:space="preserve">siren@dev:~$ cat stack.txt</text>
    <text x="24" y="146" font-size="14" fill="#e6edf3" xml:space="preserve">React because I have to</text>
    <text x="24" y="167" font-size="14" fill="#e6edf3" xml:space="preserve">Go because it&#x27;s fast</text>
    <text x="24" y="188" font-size="14" fill="#e6edf3" xml:space="preserve">Rust because I enjoy fighting the borrow checker at 2am for sport</text>
    <text x="24" y="209" font-size="14" fill="#e6edf3" xml:space="preserve">Python whenever I need to convince someone I do data science</text>
    <text x="24" y="230" font-size="14" fill="#8b949e" xml:space="preserve">(it&#x27;s mostly just pandas and vibes)</text>
    <text x="24" y="272" font-size="14" fill="#7ee787" xml:space="preserve">siren@dev:~$ ./fix_bug.sh</text>
