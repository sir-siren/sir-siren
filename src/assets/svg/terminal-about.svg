    <text x="24" y="314" font-size="14" fill="#79c0ff" xml:space="preserve">note: bug has been relocated to a different function</text>
    <text x="24" y="335" font-size="14" fill="#79c0ff" xml:space="preserve">note: this is called refactoring now</text>
    <text x="24" y="356" font-size="14" fill="#e3b341" xml:space="preserve">status: it works, nobody including me knows why, peace has been made</text>
    <text x="24" y="398" font-size="14" fill="#7ee787" xml:space="preserve">siren@dev:~$ cat habits.log</text>
    <text x="24" y="419" font-size="14" fill="#8b949e" xml:space="preserve">[INFO] skipped the docs, went straight to the code example</text>
